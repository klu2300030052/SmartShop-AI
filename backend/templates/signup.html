<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup - SmartShop AI</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<header class="navbar">

<div class="logo">
🛒 SmartShop AI
</div>

<nav>

<a href="/">Home</a>

<a href="/login">Login</a>

</nav>

</header>

<div style="width:400px;margin:60px auto;background:white;padding:30px;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,.2);">

<h2 style="text-align:center;">Create Account</h2>

<form action="/signup" method="POST">

<input
type="text"
name="name"
placeholder="Full Name"
required
style="width:100%;padding:12px;margin:10px 0;">

<input
type="email"
name="email"
placeholder="Email"
required
style="width:100%;padding:12px;margin:10px 0;">

<input
type="password"
name="password"
placeholder="Password"
required
style="width:100%;padding:12px;margin:10px 0;">

<button class="view-btn" style="width:100%;">
Create Account
</button>

</form>

</div>

</body>
</html>
